<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seasonal Colour Palette</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Seasonal Colour Palette</h1>

    <nav>
      <a href="#find-your-palette">About</a>
      <a href="#how-it-works">How It Works</a>
    </nav>
  </header>


  <main>

    <!-- INTRO -->

    <section id="find-your-palette" class="intro">

      <h2>Find Your Palette</h2>

      <p>
        Discover the colours that harmonise with your natural colouring,
        elevate your style and bring out your unique glow.
      </p>

    </section>


    <!-- HOW IT WORKS -->

    <section id="how-it-works" class="how-it-works">

      <h2>How It Works</h2>

      <p>
        Choose a season below to explore its unique colour palette.
      </p>

      <div class="season-buttons">

        <button id="springButton" class="season-button">Spring</button>
        <button id="summerButton" class="season-button">Summer</button>
        <button id="autumnButton" class="season-button">Autumn</button>
        <button id="winterButton" class="season-button">Winter</button>

      </div>

    </section>


    <!-- COLOUR WHEEL -->

    <section class="palette">

      <h2 id="seasonTitle"></h2>

      <div id="colourWheel" class="colour-wheel"></div>

      <p id="colourName"></p>

    </section>


    <!-- INFORMATION BUTTONS -->

    <section class="options">

      <button id="aboutButton">About the Season</button>

      <button id="neutralsButton">Neutrals</button>

      <button id="metalsButton">Metals &amp; Accents</button>

      <button id="makeupButton">Makeup &amp; Styling</button>

    </section>


    <!-- SEASON INFORMATION -->

    <section id="seasonInformation" class="season-information">

      <h2 id="informationTitle"></h2>

      <div id="informationContent"></div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
